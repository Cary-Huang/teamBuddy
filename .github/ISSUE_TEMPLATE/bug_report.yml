name: Bug report
description: 报告可复现的问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 感谢你帮助改进 TeamBuddy。安全漏洞请使用 Security 页面私下报告。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰说明实际行为和期望行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 执行……
        3. 观察到……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: main / commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、浏览器、Node.js、Docker 和 PostgreSQL 版本。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或补充信息
      description: 请删除凭据、个人信息和内部地址。
      render: shell
